<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo circular con margen de seguridad ampliado (18% padding) para recorte circular de avatares -->
  <circle cx="256" cy="256" r="256" fill="#0D0D0F"/>
  
  <!-- Hexágono exacto del logo real (escalado 8x desde viewBox 64→512) con 18% padding extra -->
  <!-- Original: points="32,7 54,19.5 54,44.5 32,57 10,44.5 10,19.5" stroke-width="5" -->
  <!-- Escalado 0.85x para dar margen: radio 200→170px (66% del canvas) -->
  <polygon 
    points="256,86 406,171 406,341 256,426 106,341 106,171" 
    fill="none" 
    stroke="#D2B474" 
    stroke-width="34" 
    stroke-linejoin="miter"
  />
  
  <!-- M exacta del logo real (escalada 8x desde viewBox 64→512) con 18% padding extra -->
  <!-- Original: d="M18 43V22L32 35L46 22V43" stroke-width="5.5" -->
  <!-- Escalado 0.85x centrado -->
  <path 
    d="M161 331V188L256 276L351 188V331" 
    stroke="#F2F2F3" 
    stroke-width="37" 
    stroke-linecap="square" 
    stroke-linejoin="miter"
    fill="none"
  />
</svg>